version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: steelmc

build:
  toolchains: []
  run_buildscript: false

images:
  - id: steelmc
    target: service
    service: steel
    source: ghcr.io/steel-foundation/steelmc
    channel: custom
    sort: semver
    tag_regex: '^v[0-9]+\.[0-9]+\.[0-9]+-mc[0-9]+\.[0-9]+$'
    version_regex: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)-mc[0-9]+\.[0-9]+$'
    version_template: '{version}'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: SteelMC
    summary: "Rust 编写的 Minecraft Java 版服务器（pre-alpha）"
